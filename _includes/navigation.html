<div class="navigation-wrapper">
	<div class="site-name">
		<a href="{{ site.url }}">{{ site.title }}</a>
	</div><!-- /.site-name -->
  {% assign current_url = page.url | remove: 'index.html' | append: '/' | replace: '//', '/' %}
	<div class="top-navigation">
		<nav role="navigation" itemscope itemtype="http://schema.org/SiteNavigationElement">
		    <ul>
		        {% for link in site.links %}
            {% assign link_url = link.url | append: '/' | replace: '//', '/' %}
            <li><a href="{{ site.url }}{{ link.url }}" {% if current_url == link_url %}class="top-navigation-current" aria-current="page"{% endif %}>{{ link.title }}</a></li>
		        {% endfor %}
		    </ul>
		</nav>
	</div><!-- /.top-navigation -->
</div><!-- /.navigation-wrapper -->
